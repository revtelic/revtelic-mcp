[project]
name = "revtelic"
version = "1.0.0"
description = "Revtelic Python SDK & MCP Server — Zero-friction B2B sales deal health intelligence for AI agents"
readme = "README.md"
authors = [
  { name = "Revtelic", email = "contact@revtelic.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.2.0",
]
crewai = [
  "crewai-tools>=0.1.0",
]
all = [
  "langchain-core>=0.2.0",
  "crewai-tools>=0.1.0",
]

[project.scripts]
revtelic-mcp = "revtelic.mcp_server:main"

[project.urls]
Homepage = "https://revtelic.com"
Repository = "https://github.com/revtelic/revtelic-mcp"
Documentation = "https://revtelic.com/docs"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["revtelic*"]
